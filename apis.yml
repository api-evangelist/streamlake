aid: streamlake
name: StreamLake
description: StreamLake (STREAMLAKE PTE. LTD.) is the cloud and AI model platform of Kuaishou. Its Vanchin model service offers
  pay-as-you-go and Coding Plan access to KwaiKAT (KAT-Coder) models and hosted third-party open models (Qwen, DeepSeek, GLM,
  Kimi, MiniMax, MiMo) through an OpenAI-compatible chat completions endpoint and a Claude Code compatible proxy at vanchin.streamlake.ai,
  alongside audio and video SDKs for capture, editing and playback.
